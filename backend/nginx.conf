# 小番茄题库浓缩版 - Nginx 配置
# 放到 /etc/nginx/sites-available/ 下，然后 ln -s 到 sites-enabled/

server {
    listen 8898;
    server_name _;

    # 静态网站根目录（前端 HTML）
    root /var/www/exam-bank;
    index index.html;

    # API 反向代理到 FastAPI 后端（端口 8890）
    location /api/ {
        proxy_pass http://127.0.0.1:8890/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 静态文件
    location / {
        try_files $uri $uri/ =404;
    }

    # 限制评论接口请求频率（防刷）
    location /api/comment {
        limit_req zone=comment_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:8890/api/comment;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# 需要在 nginx.conf 的 http 块中添加：
# limit_req_zone $binary_remote_addr zone=comment_limit:10m rate=1r/s;
