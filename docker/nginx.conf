server {
    listen 8898;
    server_name _;
    root /var/www/exam-bank;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8890/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
